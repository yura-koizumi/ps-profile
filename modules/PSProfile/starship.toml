"$schema" = 'https://starship.rs/config-schema.json'

# ─────────────────────────────────────────────────────────────
#  PSProfile starship preset
#  - Nerd Font / Powerline 非依存 (どのモノスペースフォントでも崩れない)
#  - tokyo-night パレット
#  - 1 行レイアウト: 左に user@host / dir / git、右端に言語バージョン / 時刻
#  - 軽量化: 遅いモジュール (docker / java / dotnet / cloud 系) を無効化し
#    command_timeout を短く設定。プロンプト描画のもたつきを抑える。
# ─────────────────────────────────────────────────────────────

add_newline = false
palette = 'tokyo_night'
command_timeout = 500

format = '$username$hostname$directory$git_branch$git_status$git_state$cmd_duration$character'
right_format = '$nodejs$python$rust$golang$time'

# ── パレット ─────────────────────────────────────────────────
[palettes.tokyo_night]
fg     = '#c0caf5'
muted  = '#565f89'
blue   = '#7aa2f7'
cyan   = '#7dcfff'
green  = '#9ece6a'
orange = '#ff9e64'
purple = '#bb9af7'
red    = '#f7768e'
yellow = '#e0af68'

# ── 利用者 / ホスト ───────────────────────────────────────────
# どの端末・どのアカウントで作業しているかを常に見えるようにする。
# SSH 時だけではなく、ローカル PowerShell でも user@host を表示する。
[username]
show_always = true
style_user  = 'fg:purple'
style_root  = 'bold fg:red'
format      = '[$user]($style)'

[hostname]
ssh_only = false
style    = 'fg:cyan'
format   = '[@$hostname]($style)[:](fg:muted) '

# ── カレントディレクトリ ─────────────────────────────────────
[directory]
style             = 'bold fg:blue'
format            = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 8
truncation_symbol = '…/'
truncate_to_repo  = false
home_symbol       = '~'
read_only         = ' (ro)'
read_only_style   = 'fg:red'

# ── Git ──────────────────────────────────────────────────────
[git_branch]
symbol            = ''
style             = 'fg:green'
truncation_length = 24
truncation_symbol = '…'
only_attached     = true
format            = '[on ](fg:muted)[$branch]($style) '

[git_status]
style      = 'fg:yellow'
conflicted = '[≠${count}](fg:red) '
ahead      = '[⇡${count}](fg:green) '
behind     = '[⇣${count}](fg:yellow) '
diverged   = '[⇕⇡${ahead_count}⇣${behind_count}](fg:orange) '
untracked  = '[?${count}](fg:muted) '
stashed    = '[*](fg:cyan) '
modified   = '[!${count}](fg:yellow) '
staged     = '[+${count}](fg:green) '
renamed    = '[»${count}](fg:cyan) '
deleted    = '[✘${count}](fg:red) '
format     = '$all_status$ahead_behind'

[git_state]
style  = 'fg:orange'
format = '[\($state $progress_current/$progress_total\)]($style) '

# ── 実行時間 ─────────────────────────────────────────────────
[cmd_duration]
min_time          = 2000
show_milliseconds = false
style             = 'fg:yellow'
format            = '[took $duration]($style) '

# ── プロンプト記号 ───────────────────────────────────────────
[character]
success_symbol = '[❯](bold fg:green) '
error_symbol   = '[❯](bold fg:red) '
vimcmd_symbol  = '[❮](bold fg:green) '

# ── 右端: 言語バージョン (簡素、色のみ) ─────────────────────
[nodejs]
symbol = 'node '
style  = 'fg:green'
format = '[$symbol$version]($style) '

[python]
symbol = 'py '
style  = 'fg:yellow'
format = '[$symbol$version( \($virtualenv\))]($style) '

[rust]
symbol = 'rust '
style  = 'fg:orange'
format = '[$symbol$version]($style) '

[golang]
symbol = 'go '
style  = 'fg:cyan'
format = '[$symbol$version]($style) '

# ── 右端: 時刻 ───────────────────────────────────────────────
[time]
disabled    = false
time_format = '%H:%M:%S'
style       = 'fg:muted'
format      = '[$time]($style)'

# ── 無効化モジュール (軽量化 / 1 行化) ───────────────────────
# java / dotnet / docker_context は version 取得が遅くプロンプトを待たせる
[java]
disabled = true
[dotnet]
disabled = true
[docker_context]
disabled = true
[os]
disabled = true
[package]
disabled = true
[terraform]
disabled = true
[azure]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
[memory_usage]
disabled = true
